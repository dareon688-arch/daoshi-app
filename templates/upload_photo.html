<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传合照 · 老邢和他的学生们</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='guofeng.css') }}" rel="stylesheet">
    {% include '_pwa_head.html' %}
</head>
<body>
    <div class="container py-4" style="max-width: 480px;">

        <a href="{{ url_for('album') }}" class="btn btn-sm btn-bamboo mb-3">‹ 返回相册</a>
        <h1 class="brush mb-3" style="font-size:24px;">上传合照</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="alert alert-warning py-2">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" class="gf-card">
            <div class="p-3">
                <div class="mb-3">
                    <label class="form-label">选择照片 <span class="text-danger">*</span></label>
                    <input type="file" name="photo" accept="image/*" class="form-control" required>
                    <div class="form-text">支持 png/jpg/jpeg/gif/webp，5MB 以内。</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">说明（选填）</label>
                    <input type="text" name="caption" class="form-control"
                           placeholder="例如：2024 迎新聚餐" maxlength="200">
                </div>
                <button type="submit" class="btn btn-ink w-100">上传</button>
            </div>
        </form>
    </div>
</body>
</html>
