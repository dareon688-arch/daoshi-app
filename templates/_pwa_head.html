{# PWA 公共头部：在每个页面的 <head> 里 include 这一段，让整站都能“装成 App” #}
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#5f7d5a">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<style>
  /* 关闭页面切换的视图过渡动画，让 tab 切换“直接出现”而不是滑入 */
  @view-transition { navigation: none; }
  ::view-transition-old(root),
  ::view-transition-new(root) { animation: none !important; }
</style>
{# 按用户选择的主题覆盖主色（默认竹青绿） #}
{% if current_user.is_authenticated and current_user.theme == 'ink' %}
<style>:root { --bamboo:#3a3a3a; --bamboo-dark:#1a1a1a; }</style>
{% elif current_user.is_authenticated and current_user.theme == 'coral' %}
<style>:root { --bamboo:#b1322f; --bamboo-dark:#8a2522; }</style>
{% endif %}
<script>
  // 注册 Service Worker（让网页可被“添加到主屏幕”安装成 App）
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (e) {
        console.log("SW 注册失败（不影响正常使用）:", e);
      });
    });
  }
</script>
