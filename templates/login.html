<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 老邢和他的学生们</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='guofeng.css') }}" rel="stylesheet">
    {% include '_pwa_head.html' %}
    <style>
        .login-stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .scroll {
            width: 100%;
            max-width: 330px;
            background: var(--xuan-paper);
            border-radius: 14px;
            padding: 30px 0 26px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            overflow: hidden;
        }
        /* 竖排书法区 */
        .calli {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
            height: 320px;
            color: var(--ink);
        }
        .calli .col { display: flex; flex-direction: column; align-items: center; }
        .col-left  { line-height: 1; }
        .col-right { line-height: 1.2; margin-top: 78px; }
        .login-box { margin: 8px 26px 0; border-top: 1px solid var(--border-soft); padding-top: 18px; }

        /* ===== 封面动画 ===== */
        .scroll { position: relative; }   /* 让飘落光点定位在卡片内 */

        /* 标题逐字浮现：每个字初始透明+下移，依次淡入上浮，像一笔笔写出来 */
        .calli .ink-char {
            opacity: 0;
            transform: translateY(14px);
            animation: charIn .7s ease forwards;
        }
        @keyframes charIn {
            to { opacity: 1; transform: translateY(0); }
        }
        /* 主字“邢”浮现后，缓慢呼吸（轻微放大缩小），温馨灵动 */
        .ink-main {
            animation: charIn .7s ease forwards, breathe 4s ease-in-out 1.2s infinite;
            transform-origin: center;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }
        /* 印章：最后“啪”地盖下——放大回弹+轻微转正 */
        .seal-stamp {
            opacity: 0;
            animation: stampIn .5s cubic-bezier(.34,1.56,.64,1) 1.5s forwards;
        }
        @keyframes stampIn {
            0%   { opacity: 0; transform: scale(2.4) rotate(-12deg); }
            60%  { opacity: 1; transform: scale(.9) rotate(3deg); }
            100% { opacity: .85; transform: scale(1) rotate(0); }
        }
        /* 顶部“师门如家/欢迎回家”柔和淡入 */
        .fade-top { opacity: 0; animation: charIn 1s ease .2s forwards; }

        /* 背景飘落的小光点（温馨氛围），纯装饰、不挡操作 */
        .petal {
            position: absolute; top: -12px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--seal-red); opacity: .0;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0%   { transform: translateY(0) translateX(0) rotate(0); opacity: 0; }
            10%  { opacity: .5; }
            90%  { opacity: .5; }
            100% { transform: translateY(360px) translateX(16px) rotate(180deg); opacity: 0; }
        }
        /* 尊重“减少动态效果”的系统设置：关掉动画 */
        @media (prefers-reduced-motion: reduce) {
            .calli .ink-char, .ink-main, .seal-stamp, .fade-top, .petal {
                animation: none !important; opacity: 1 !important; transform: none !important;
            }
            .petal { display: none; }
        }

        /* ===== 安装到桌面提示条（默认藏在屏幕外，.show 时滑入）===== */
        .install-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
            background: var(--xuan-paper);
            border-top: 1px solid var(--border-soft);
            box-shadow: 0 -4px 20px rgba(0,0,0,.12);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            display: flex; align-items: center; gap: 12px;
            transform: translateY(120%);
            transition: transform .35s ease;
        }
        .install-bar.show { transform: translateY(0); }
        .install-bar .ib-icon {
            width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
            background-size: cover; background-position: center;
        }
        .install-bar .ib-text { flex-grow: 1; line-height: 1.3; }
        .install-bar .ib-title { font-size: 14px; color: var(--ink); }
        .install-bar .ib-sub { font-size: 12px; color: var(--muted); }
        .install-bar .ib-install {
            flex-shrink: 0; border: none; border-radius: 8px;
            background: var(--bamboo); color: #fff;
            font-size: 14px; padding: 8px 16px;
        }
        .install-bar .ib-close {
            flex-shrink: 0; border: none; background: transparent;
            color: var(--muted); font-size: 22px; line-height: 1;
            padding: 0 4px;
        }
    </style>
</head>
<body>
    <div class="login-stage">
        <div class="scroll">

            <!-- 飘落的温馨小光点（纯装饰） -->
            <span class="petal" style="left:18%; animation-duration:7s;  animation-delay:1.6s;"></span>
            <span class="petal" style="left:42%; animation-duration:9s;  animation-delay:3.2s; background:var(--bamboo);"></span>
            <span class="petal" style="left:68%; animation-duration:8s;  animation-delay:2.4s;"></span>
            <span class="petal" style="left:85%; animation-duration:10s; animation-delay:4.5s; background:var(--bamboo);"></span>

            <!-- 顶部：师门如家 / 欢迎回家 -->
            <div class="text-center mb-1 fade-top">
                <div class="brush" style="font-size:18px; letter-spacing:6px;">师门如家</div>
                <div class="gf-subtitle" style="font-size:12px; margin-top:6px;">欢迎回家</div>
            </div>

            <!-- 竖排书法：老邢和 / 他的学生们 / 印章（逐字浮现） -->
            <div class="calli brush">
                <div class="col col-left">
                    <span class="ink-char" style="font-size:36px; margin-top:34px; animation-delay:.25s;">老</span>
                    <span class="ink-char ink-main" style="font-size:104px; margin:4px 0; animation-delay:.45s;">邢</span>
                    <span class="ink-char" style="font-size:32px; animation-delay:.65s;">和</span>
                </div>
                <div class="col col-right">
                    <span class="ink-char" style="font-size:42px; animation-delay:.8s;">他</span>
                    <span class="ink-char" style="font-size:36px; animation-delay:.95s;">的</span>
                    <span class="ink-char" style="font-size:44px; animation-delay:1.1s;">学</span>
                    <span class="ink-char" style="font-size:40px; animation-delay:1.25s;">生</span>
                    <span class="ink-char" style="font-size:38px; animation-delay:1.4s;">们</span>
                </div>
                <div style="align-self:flex-end; margin-bottom:20px;">
                    <span class="seal seal-stamp" style="width:30px; height:30px; font-size:11px;">邢门</span>
                </div>
            </div>

            <!-- 底部：登录表单（占比小、低调） -->
            <div class="login-box">
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for msg in messages %}
                      <div class="alert alert-warning py-2 small">{{ msg }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login') }}">
                    <input type="text" name="username" class="form-control form-control-sm mb-2"
                           placeholder="用户名" required autofocus
                           style="height:38px;">
                    <input type="password" name="password" class="form-control form-control-sm mb-3"
                           placeholder="密码" required
                           style="height:38px;">
                    <button type="submit" class="btn btn-ink w-100" style="height:40px;">登 录</button>
                </form>
                <div class="text-center mt-2">
                    <a href="{{ url_for('register') }}" class="small" style="color:var(--muted);">没有账号？申请加入 ›</a>
                </div>
            </div>

        </div>
    </div>

    <!-- 安装到桌面提示条（默认隐藏，安卓等支持时由 install-prompt.js 滑出）-->
    <div class="install-bar" id="installBar">
        <span class="ib-icon" style="background-image:url('{{ url_for('static', filename='icon-192.png') }}');"></span>
        <div class="ib-text">
            <div class="ib-title">把"导师组"装到桌面</div>
            <div class="ib-sub">像 App 一样打开，更方便</div>
        </div>
        <button type="button" class="ib-install" id="installBtn">安装</button>
        <button type="button" class="ib-close" id="installClose" aria-label="关闭">×</button>
    </div>

    <script src="{{ url_for('static', filename='install-prompt.js') }}"></script>
</body>
</html>
