<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发公告 · 导师组</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include '_pwa_head.html' %}
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 560px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="{{ url_for('announcements') }}" class="btn btn-sm btn-outline-secondary">‹ 返回</a>
            <h1 class="h5 fw-bold m-0">发布公告</h1>
            <span style="width:48px;"></span>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="alert alert-warning py-2">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">标题</label>
                    <input type="text" name="title" class="form-control" required autofocus
                           placeholder="如：本周组会安排">
                </div>
                <div class="mb-3">
                    <label class="form-label">内容</label>
                    <textarea name="content" class="form-control" rows="6" required
                              placeholder="写公告正文，可以分多行"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">发布</button>
            </div>
        </form>
    </div>
</body>
</html>
