<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ group_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 480px;">

        <!-- 顶部：问候 + 退出 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="text-muted">你好，<strong>{{ current_user.name }}</strong> 👋</span>
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-secondary">退出</a>
        </div>

        <div class="text-center mb-4">
            <h1 class="h3 fw-bold">{{ group_name }}</h1>
            <p class="text-muted">内部小站</p>
        </div>

        <!-- flash 提示（比如改完密码后的成功消息） -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="alert alert-success py-2">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h2 class="h5 card-title">第 2 步完成 ✅</h2>
                <p class="card-text">登录系统已经就位：你现在是登录状态才能看到这一页。</p>
                <p class="card-text text-muted small mb-0">下一步会加上成员名片和个人信息编辑。</p>
            </div>
        </div>

        <div class="d-grid">
            <a href="{{ url_for('change_password') }}" class="btn btn-outline-primary">修改我的密码</a>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">{{ group_name }} · 内部使用</p>
    </div>
</body>
</html>
