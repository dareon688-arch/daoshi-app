<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布活动 · 老邢和他的学生们</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='guofeng.css') }}" rel="stylesheet">
    {% include '_pwa_head.html' %}
</head>
<body>
    <div class="container py-4" style="max-width: 480px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="{{ url_for('footprint') }}" class="btn btn-sm btn-bamboo">‹ 返回</a>
            <h1 class="brush m-0" style="font-size:22px;">发布活动</h1>
            <span style="width:48px;"></span>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}{% for msg in messages %}
            <div class="alert alert-warning py-2">{{ msg }}</div>
          {% endfor %}{% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" class="gf-card">
            <div class="p-3">
                <div class="mb-3">
                    <label class="form-label">活动标题 <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" required autofocus
                           placeholder="如：2024 迎新聚餐">
                </div>
                <div class="mb-3">
                    <label class="form-label">活动日期（选填）</label>
                    <input type="date" name="happened_on" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">封面图（选填）</label>
                    <input type="file" name="cover" accept="image/*" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">文案 / 记述（选填）</label>
                    <textarea name="content" class="form-control" rows="5" placeholder="记录这次活动的点滴…"></textarea>
                </div>
                <button type="submit" class="btn btn-ink w-100">发布</button>
            </div>
        </form>
    </div>
</body>
</html>
