<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息 · 老邢和他的学生们</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='guofeng.css') }}" rel="stylesheet">
    {% include '_pwa_head.html' %}
</head>
<body>
    <div class="container py-4" style="max-width: 560px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="brush m-0" style="font-size:22px;">消息</h1>
            <div class="d-flex gap-2">
                <a href="{{ url_for('meeting') }}" class="btn btn-sm btn-bamboo">会议</a>
                <a href="{{ url_for('new_group') }}" class="btn btn-sm btn-ink">+ 建群</a>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="alert alert-success py-2">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- 会话列表（实时推送来时会局部刷新这个容器） -->
        <div id="chatList">
            {% include '_chat_list.html' %}
        </div>

    </div>

    {% set active = 'chat' %}
    {% include '_navbar.html' %}

    <script>
        // 消息页：收到实时推送 / 页面重新可见时，局部刷新会话列表（红点、最后消息都更新）
        (function () {
            function refreshList() {
                fetch('/chat/list', { credentials: 'same-origin' })
                    .then(function (r) { return r.text(); })
                    .then(function (html) {
                        var box = document.getElementById('chatList');
                        if (box) box.innerHTML = html;
                    })
                    .catch(function () {});
            }
            // 复用 _navbar 里已建立的同一条 socket（避免每页开多条连接占满服务器线程）
            if (window.__navSocket) {
                window.__navSocket.on('unread_update', refreshList);
            }
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) refreshList();
            });
            // 关键：从“后退缓存(bfcache)”恢复时（电脑Chrome点返回回到本页）也刷新
            window.addEventListener('pageshow', function (e) { refreshList(); });
            // 兜底：停在消息页时每 10 秒刷一次列表
            setInterval(function () { if (!document.hidden) refreshList(); }, 10000);
        })();
    </script>
</body>
</html>
