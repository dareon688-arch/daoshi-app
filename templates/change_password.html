<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · 导师组</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include '_pwa_head.html' %}
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 400px;">
        <h1 class="h4 text-center mb-4">修改密码</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="alert alert-warning py-2">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">当前密码</label>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">新密码（至少 6 位）</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">确认修改</button>
                <a href="{{ url_for('home') }}" class="btn btn-link w-100 mt-2">返回首页</a>
            </div>
        </form>
    </div>
</body>
</html>
