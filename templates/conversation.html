<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} · 老邢和他的学生们</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='guofeng.css') }}" rel="stylesheet">
    {% include '_pwa_head.html' %}
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; }
        .chat-header {
            flex: 0 0 auto;
            background: var(--xuan-paper);
            border-bottom: 1px solid var(--border-soft);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .chat-body {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 14px;
            max-width: 600px; width: 100%; margin: 0 auto;
        }
        .chat-input {
            flex: 0 0 auto;
            border-top: 1px solid var(--border-soft);
            background: var(--xuan-paper);
            padding: 10px;
            display: flex; gap: 8px;
            max-width: 600px; width: 100%; margin: 0 auto;
        }
        .msg { margin-bottom: 12px; display: flex; flex-direction: column; }
        .msg.mine { align-items: flex-end; }
        .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
        .bubble {
            display: inline-block; max-width: 78%;
            padding: 8px 12px; border-radius: 12px;
            background: #fffdf6; border: 1px solid var(--border-soft);
            word-break: break-word; white-space: pre-wrap; text-align: left;
        }
        .msg.mine .bubble { background: var(--bamboo); color: #fff; border-color: var(--bamboo); }
        .msg .time { font-size: 10px; color: var(--muted); margin-top: 2px; }
    </style>
</head>
<body>
    <div class="chat-header">
        <a href="{{ url_for('chat') }}" class="btn btn-sm btn-bamboo">‹</a>
        <span class="brush" style="font-size:18px;">{{ title }}</span>
        {% if conv.is_group %}<span class="small" style="color:var(--muted);">· {{ conv.memberships|length }}人</span>{% endif %}
    </div>

    <div class="chat-body" id="chatBody">
        {% for m in msgs %}
        <div class="msg {{ 'mine' if m.sender_id == current_user.id else '' }}">
            {% if conv.is_group and m.sender_id != current_user.id %}
            <div class="who">{{ m.sender.name }}</div>
            {% endif %}
            <div class="bubble">{{ m.content }}</div>
            <div class="time">{{ m.created_at.strftime('%H:%M') }}</div>
        </div>
        {% endfor %}
    </div>

    <form class="chat-input" id="sendForm" autocomplete="off">
        <input type="text" id="msgInput" class="form-control" placeholder="说点什么…" autofocus>
        <button type="submit" class="btn btn-ink" style="white-space:nowrap;">发送</button>
    </form>

    <script>
        const convId = {{ conv.id }};
        const isGroup = {{ 'true' if conv.is_group else 'false' }};
        const body = document.getElementById('chatBody');
        let lastId = {{ msgs[-1].id if msgs else 0 }};

        function scrollToBottom() { body.scrollTop = body.scrollHeight; }
        scrollToBottom();

        function esc(s) {
            const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
        }
        function addMsg(m) {
            const div = document.createElement('div');
            div.className = 'msg' + (m.mine ? ' mine' : '');
            let html = '';
            if (isGroup && !m.mine) html += '<div class="who">' + esc(m.sender_name) + '</div>';
            html += '<div class="bubble">' + esc(m.content) + '</div>';
            html += '<div class="time">' + m.time + '</div>';
            div.innerHTML = html;
            body.appendChild(div);
        }

        // 发送消息
        document.getElementById('sendForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const fd = new FormData();
            fd.append('content', text);
            try {
                const r = await fetch('/chat/' + convId + '/send', { method: 'POST', body: fd });
                const data = await r.json();
                if (data.ok) { await poll(); }
            } catch (err) { console.error(err); }
        });

        // 轮询拉新消息
        async function poll() {
            try {
                const r = await fetch('/chat/' + convId + '/poll?after=' + lastId);
                const data = await r.json();
                if (data.ok && data.messages.length) {
                    data.messages.forEach(m => { addMsg(m); lastId = Math.max(lastId, m.id); });
                    scrollToBottom();
                }
            } catch (err) { console.error(err); }
        }
        // 每 2 秒拉一次新消息
        setInterval(poll, 2000);
    </script>
</body>
</html>
